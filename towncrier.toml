[tool.towncrier]
directory = "changelog"
filename = "CHANGELOG.md"
title_format = "## Version {version} ({project_date})"
start_string = "<!-- towncrier release notes start -->\n"
issue_format = "[#{issue}](https://github.com/AeroMAPS/AeroMAPS/issues/{issue})"

# Definition of sections

[[tool.towncrier.section]]
name = "Web app"
path = "app"

[[tool.towncrier.section]]
name = "Models"
path = "models"

[[tool.towncrier.section]]
name = "Package"
path = ""

# Definition of fragment types
[[tool.towncrier.type]]
directory = "feat"
name = "Feature"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Miscellaneous change"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking change"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

