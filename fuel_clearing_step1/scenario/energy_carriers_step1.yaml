### STEP-1 FUEL-CLEARING BENCH -- energy carriers ###
# Two drop-in pathways only: one sustainable (HEFA-FOG) and the fossil default.
# Extracted verbatim from resources/data/default_energy_carriers/energy_carriers_data.yaml
# so the reference run is comparable to the standard configuration.
#
# No hydrogen and no electric pathway on purpose: step 1's market lives on
# `energy_consumption_dropin_fuel` alone, and a type without an allocator would be
# silently unserved in the market mode (see INVENTORY.md section 4).

hefa_fog:
  # Metadata
  name: "hefa_fog"
  environmental_model: "top-down"
  cost_model: "top-down"
  aircraft_type: "dropin_fuel"
  energy_origin: "biomass"
  default: False
  # Until level two used to separate inputs. Then concatenated in variable name.
  inputs:
    # Policy
    mandate:
      mandate_type: "share"
      # ReFuelEU Aviation's SAF obligation, as a STEP: each level holds until the
      # next one starts (`method: previous` -> scipy interp1d kind="previous"), which
      # is how the regulation reads and how the migrated optimisation work treats the
      # 2025 obligation -- not a phase-in interpolated from 2020.
      #
      # Replaces hefa_fog's share from the default 13-pathway config. There its shape
      # came from five other sustainable pathways competing for feedstock; lifted out
      # alone it peaked at 4.8 % in 2030 and collapsed to 0.17 % by 2040, so the
      # ramp-up never bound and the buy-out never engaged. A monotone obligation is
      # what the market mode exists to study.
      mandate_share: !AeroMapsCustomDataType
        years: [ 2020, 2025, 2030, 2035, 2040, 2045, 2050 ]
        values: [ 0.0, 2.0, 6.0, 20.0, 34.0, 42.0, 70.0 ]
        method: previous
    # Technical:
    technical:
      resource_names: [ "hefa_fog_biomass" ]
      resource_specific_consumption:
        hefa_fog_biomass: 1.14
      kerosene_selectivity: 0.15
      lhv: 44
    # Environmental:
    environmental:
      mean_co2_emission_factor_without_resource: !AeroMapsCustomDataType
        years: []
        values: [20.7]
        method: linear
      emission_index:
        h2o: 1.231
        nox: 0.01514
        sulfur: 0.0
        soot: 6.0e-06
        particles_number: 8.0e+13
    # Economics:
    economics:
      mean_mfsp_without_resource: !AeroMapsCustomDataType
        years: []
        values: [0.02317] # Converted 0.815488 €/L to €/MJ with 0.8 density and 44 LHV
        method: linear
  outputs:

fossil_kerosene:
  # Metadata
  name: "fossil_kerosene"
  environmental_model: "top-down"
  cost_model: "top-down"
  aircraft_type: "dropin_fuel"
  energy_origin: "fossil"
  default: True
  inputs:
    # Technical:
    technical:
      lhv: 44
      plant_load_factor: 0.95
      plant_lifespan: 25
    # Environmental:
    environmental:
      mean_co2_emission_factor_without_resource: !AeroMapsCustomDataType
        years: [ 2000, 2050 ]
        values: [ 88.7, 88.7 ]
        method: linear
      emission_index:
        h2o: 1.231 # 
        nox: 0.01514
        sulfur: 0.0012
        soot: 3.0e-05
        particles_number: 2.0e+14
    # Economics:
    economics:
      mean_mfsp_without_resource: !AeroMapsCustomDataType
        years: [2000, 2001, 2002, 2003, 2004, 2005,
                2006, 2007, 2008, 2009, 2010, 2011,
                2012, 2013, 2014, 2015, 2016, 2017,
                2018, 2019, 2020, 2021, 2022, 2023,
                2024, 2050]
        values: [0.008364654, 0.006916631, 0.006340188, 0.007424531, 0.010158403,
        0.014797798, 0.016189765, 0.017474982, 0.023710593, 0.01277897,
        0.016366254, 0.022487714, 0.022192747, 0.020655099, 0.018819777,
        0.010615193, 0.008737464, 0.01085308, 0.013921201, 0.012684225,
        0.007299796, 0.01202598, 0.019909217, 0.014922935, 0.012596014, 0.012]
        method: linear
  outputs:
