### POOL BENCH, REGION A -- five drop-in pathways, offered rather than mandated ###
#
# The pathways, costs and emission factors of ../energy_carriers_five.yaml, verbatim, with
# two edits:
#
#   1. No `mandate` blocks. Under `regionalisation.fuel_trade: pool` nothing allocates a
#      region's own mix -- EnergyUseChoice is not instantiated -- so the mandates that set
#      it are gone. What a region burns is its share of the world pool.
#   2. A `supply` block per non-default pathway: the volume this region OFFERS to the
#      pool, in MJ per year (`{p}_energy_offered`). The pool bench requires one for every
#      non-default pathway of every region, zero included.
#
# Region A is the SAF-rich one: waste oils, municipal waste, alcohols and power for
# e-fuels, on a clean grid (resources_pool.yaml) but at a dear power price. Region B
# (../region_B/energy_carriers_pool.yaml) offers far less, on a dirty grid, cheaper.

hefa_fog:
  name: "hefa_fog"
  environmental_model: "top-down"
  cost_model: "top-down"
  aircraft_type: "dropin_fuel"
  energy_origin: "biomass"
  default: False
  inputs:
    supply:
      energy_offered: !AeroMapsCustomDataType
        years: [ 2020, 2030, 2040, 2050 ]
        values: [ 0.1e+12, 1.0e+12, 1.5e+12, 1.5e+12 ]
        method: linear
    technical:
      resource_names: [ "hefa_fog_biomass" ]
      resource_specific_consumption:
        hefa_fog_biomass: 1.14
      kerosene_selectivity: 0.15
      lhv: 44
    environmental:
      mean_co2_emission_factor_without_resource: !AeroMapsCustomDataType
        years: []
        values: [20.7]
        method: linear
      emission_index:
        h2o: 1.231
        nox: 0.01514
        sulfur: 0.0
        soot: 6.0e-06
        particles_number: 8.0e+13
    economics:
      mean_mfsp_without_resource: !AeroMapsCustomDataType
        years: []
        values: [0.02317]
        method: linear
  outputs:

