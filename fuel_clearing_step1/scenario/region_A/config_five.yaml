# Step-1 fuel-clearing bench, region A (3.0 % CAGR).
#
# The spike's two-region wiring (rpk <-> airfare_per_rpk closed by RPKElasticity),
# but with the REAL energy cost chain: `models_energy_cost` and the generic energy
# models are what produce `{p}_mean_mfsp`, which the market reads as its cost of
# entry (decision 6). The spike replaced that chain with its own carbon tax; here it
# has to stay, because reproducing it is the point of the reference run.
#
# FIVE drop-in pathways -- see ../energy_carriers_five.yaml. Identical to config.yaml in
# every other respect, so the two benches differ in the pathway set and nothing else.
data:
  inputs:
    json_inputs_file: "./parameters.json"
  outputs:
    json_outputs_file: "./outputs.json"

models:
  markets:
    markets_data_file: "./markets.yaml"

  energy:
    energy_carriers_model_data_file: "../energy_carriers_five.yaml"
    resources_model_data_file: default
    processes_model_data_file: default

  standards:
    - models_traffic
    - models_efficiency_top_down
    - models_energy_without_fuel_effect
    - models_offset
    - models_emissions
    - models_energy_cost
    - models_operation_cost_top_down_feedback
