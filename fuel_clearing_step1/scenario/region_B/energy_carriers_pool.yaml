### POOL BENCH, REGION B -- five drop-in pathways, offered rather than mandated ###
#
# Region A's file (../region_A/energy_carriers_pool.yaml) with B's offers and B's power
# price: see there for what changed against ../energy_carriers_five.yaml and why.
#
# Region B is the SAF-poor one: a little waste oil and municipal waste, no alcohols, and
# e-fuels made from CHEAPER power on a DIRTIER grid (resources_pool.yaml). It burns more
# than A and grows faster, so its share of every pool rises over time.

hefa_fog:
  name: "hefa_fog"
  environmental_model: "top-down"
  cost_model: "top-down"
  aircraft_type: "dropin_fuel"
  energy_origin: "biomass"
  default: False
  inputs:
    supply:
      energy_offered: !AeroMapsCustomDataType
        years: [ 2020, 2030, 2040, 2050 ]
        values: [ 0.0, 0.2e+12, 0.4e+12, 0.5e+12 ]
        method: linear
    technical:
      resource_names: [ "hefa_fog_biomass" ]
      resource_specific_consumption:
        hefa_fog_biomass: 1.14
      kerosene_selectivity: 0.15
      lhv: 44
    environmental:
      mean_co2_emission_factor_without_resource: !AeroMapsCustomDataType
        years: []
        values: [20.7]
        method: linear
      emission_index:
        h2o: 1.231
        nox: 0.01514
        sulfur: 0.0
        soot: 6.0e-06
        particles_number: 8.0e+13
    economics:
      mean_mfsp_without_resource: !AeroMapsCustomDataType
        years: []
        values: [0.02317]
        method: linear
  outputs:

