# Pool bench, region B (4.5 % CAGR): ./config_five.yaml with its own carriers,
# resources and carbon tax -- the three things the pool bench makes the regions differ in.
# See ../regionalisation_pool.yaml.
data:
  inputs:
    json_inputs_file: ["./carbon_tax_pool.json"]
  outputs:
    json_outputs_file: "./outputs.json"

models:
  markets:
    markets_data_file: "./markets.yaml"

  energy:
    energy_carriers_model_data_file: "./energy_carriers_pool.yaml"
    resources_model_data_file: "./resources_pool.yaml"
    processes_model_data_file: default

  standards:
    - models_traffic
    - models_efficiency_top_down
    - models_energy_without_fuel_effect
    - models_offset
    - models_emissions
    - models_energy_cost
    - models_operation_cost_top_down_feedback
