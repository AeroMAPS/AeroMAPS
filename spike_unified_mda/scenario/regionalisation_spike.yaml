# Spike scenario: two regions coupled through ONE global, non-namespaced discipline.
regionalisation:
  execution_mode: "unified_mda"
  global_namespace: "overall"

  # The spike's reason to exist: a discipline that is NOT namespaced and whose
  # grammar spans every region ({r}:spike_fuel_demand -> {r}:spike_fuel_price).
  global_models:
    customs:
      spike_fuel_market: "./spike_market_models.py::SpikeFuelMarket"

  mda:
    tolerance: 1.0e-10
    max_mda_iter: 200
    inner_mda_name: "MDAGaussSeidel"
    log_convergence: false

  regions:
    region_A:
      config_file: "region_A/config.yaml"
    region_B:
      config_file: "region_B/config.yaml"

  aggregation:
    sum:
      - co2_emissions
      - rpk
      - ask
      - energy_consumption
    weighted_average:
      - variable: airfare_per_rpk
        weight_by: rpk
