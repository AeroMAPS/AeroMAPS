# Push fleet engine: aircraft types still delivered after the pivot year (2024),
# per segment (TP, RJ, NB, WB — the passenger market ids). Read only with the
# models_efficiency_push bundle. Every field is required:
#   name                         type name, used in output names
#   energy_efficiency            energy per ASK [MJ/ASK]
#   seats                        seats per aircraft
#   ret_year_delay               shift of the retirement age [years], 0 for none
#   reference_production_points  delivery profile: year / value [aircraft/yr] points,
#                                linear in between; end with 0 when production stops
# Full reference: docs/books/configuration/fleet_push.md
markets:
  TP:
    current_aircraft_types:
      - name: "current_gen_TP"
        energy_efficiency: 1.1
        seats: 80
        ret_year_delay: 0
        reference_production_points:
        - year: 2025
          value: 20
        - year: 2033
          value: 40
        - year: 2040
          value: 0
  RJ:
    current_aircraft_types:
      - name: "current_gen_RJ"
        energy_efficiency: 1.3
        seats: 100
        ret_year_delay: 0
        reference_production_points:
        - year: 2025
          value: 60
        - year: 2033
          value: 100
        - year: 2040
          value: 0
