### DEFAULT OFFSETS DATA ###
# Offsetting schemes for the generic offsets model. Each scheme carries a quantity rule
# and a price; the schemes sum into the aggregate carbon offset, the quantity-weighted
# mean of their prices is the aggregate carbon offset price, and each scheme's quantity
# is a sub-lever of the offsetting lever (co2_emissions_lever_offset_scheme_<name>).
#
# Quantity rules (inputs.quantity.mode):
#   - level:             emissions above `baseline_level_vs_reference_year` [%] of the
#                        `reference_year` emissions, times `coverage` [%] of emissions in
#                        scope (the CORSIA rule of the simple LevelCarbonOffset model)
#   - share_of_residual: `share` [%] of the emissions left once the level-based schemes
#                        are applied (the rule of ResidualCarbonOffset)
#   - quantity:          a prescribed `amount` [MtCO2] per year (ManualCarbonOffset)
#
# This file is not activated by the packaged default configuration, which keeps the
# simple offset models and their parameters.json inputs; add a `models.offsets` block to
# a configuration to switch to it. The two schemes below are illustrative.

corsia:
  name: "corsia"
  category: "offsets"
  inputs:
    quantity:
      mode: "level"
      reference_year: 2019
      baseline_level_vs_reference_year: !AeroMapsCustomDataType   # [%] of reference-year emissions
        years: [2020, 2050]
        values: [85.0, 85.0]
        method: linear
      coverage: !AeroMapsCustomDataType                            # [%] of emissions in scope
        years: [2020, 2023, 2024, 2027, 2050]
        values: [0.0, 0.0, 50.0, 60.0, 60.0]
        method: linear
    economics:
      price: !AeroMapsCustomDataType                               # [€/tCO2]
        years: [2020, 2024, 2035, 2050]
        values: [20.0, 20.0, 60.0, 60.0]
        method: linear

removals:
  name: "removals"
  category: "removals"
  inputs:
    quantity:
      mode: "share_of_residual"
      share: !AeroMapsCustomDataType                               # [%] of residual emissions
        years: [2020, 2035, 2050]
        values: [0.0, 0.0, 100.0]
        method: linear
    economics:
      price: !AeroMapsCustomDataType                               # [€/tCO2]
        years: [2020, 2035, 2050]
        values: [200.0, 200.0, 100.0]
        method: linear
