# ReFuelEU optimisation paper: the scenario every optimisation is built on.
data:
  inputs:
    json_inputs_file: "./partitioned_inputs_merged.json"
    partitioning_data_file: "./partitioned_inputs.json"
    partitioning_climate_data_file: "./partitioned_temperature_historical_dataset.csv"
  outputs:
    json_outputs_file: "./outputs_rte.json"

models:
  markets:
    markets_data_file: "./markets_rte.yaml"
  energy:
    energy_carriers_model_data_file: "./energy_rte.yaml"
    resources_model_data_file: "./resources_rte.yaml"
    processes_model_data_file: default
  standards:
    - models_optim_complex

  customs:
    reduced_mandate: "../helpers/constraints_rte.py::ReducedMandate"
    blend_completeness_constraint: "../helpers/constraints_rte.py::BlendCompletenessConstraint"
    biomass_availability_constraint_trajectory: "../helpers/constraints_rte.py::BiomassAvailabilityConstraintTrajectory"
    electricity_availability_constraint_trajectory: "../helpers/constraints_rte.py::ElectricityAvailabilityConstraintTrajectory"
    biofuel_use_growth_constraint: "../helpers/constraints_rte.py::BiofuelUseGrowthConstraint"
    electrofuel_use_growth_constraint: "../helpers/constraints_rte.py::ElectrofuelUseGrowthConstraint"
