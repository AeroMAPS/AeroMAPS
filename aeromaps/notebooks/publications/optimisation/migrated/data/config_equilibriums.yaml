# Cost-demand feedback calibration notebook (equilibriums.ipynb), migrated to
# AeroMAPS main (generic energy + market-generic models). World-level defaults
# throughout -- data.inputs / outputs are left unset so they fall back to the
# package's own parameters.json / partitioning_inputs.json.
models:
  markets:
    markets_data_file: "./markets_equilibriums.yaml"
  energy:
    energy_carriers_model_data_file: "./energy_carriers_equilibriums.yaml"
    resources_model_data_file: default
    processes_model_data_file: default
  standards:
    - models_optim_complex
