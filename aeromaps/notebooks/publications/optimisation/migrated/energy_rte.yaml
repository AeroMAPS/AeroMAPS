# RTE optimisation paper — migrated energy carriers.
# One generic biofuel replacing the 5 constant-share pathways (blend-weighted),
# one generic electrofuel, fossil kerosene. Values derived from the paper's own inputs.

generic_biofuel:
  name: "generic_biofuel"
  environmental_model: "top-down"
  cost_model: "top-down"
  aircraft_type: "dropin_fuel"
  energy_origin: "biomass"
  default: False
  inputs:
    mandate:
      mandate_type: "share"
      mandate_share: !AeroMapsCustomDataType
        years: [2020, 2025, 2030, 2035, 2040, 2045, 2050]
        values: [0.0, 2.0, 4.8, 15.0, 24.0, 27.0, 35.0]
        method: linear
    technical:
      resource_names: [ "generic_biomass" ]
      resource_specific_consumption:
        generic_biomass: 2.104355
      kerosene_selectivity: 1.0
      # 44 MJ/kg is the mass basis (massic shares, non-CO2 fuel mass), matching
      # optim_backwards' lhv_kerosene. The mean_mfsp values below are EUR/MJ obtained
      # by dividing the paper's EUR/L by 35.3 MJ/L, which is the volumetric basis its
      # cost models hardcoded -- not 0.8 x 44 = 35.2. Reproducing the paper needs 35.3.
      lhv: 44
    environmental:
      mean_co2_emission_factor_without_resource: !AeroMapsCustomDataType
        years: [2000, 2050]
        values: [20.8269, 20.8269]
        method: linear
      emission_index:
        h2o: 1.231
        nox: 0.01514
        sulfur: 0.0
        soot: 6.0e-06
        particles_number: 8.0e+13
    economics:
      mean_mfsp_without_resource: !AeroMapsCustomDataType
        years: [2000, 2050]
        values: [0.03737851105, 0.03737851105]  # 1.3195 EUR/L / 35.3, blend-weighted from the 5 pathways
        method: linear
  outputs:

generic_electrofuel:
  name: "generic_electrofuel"
  environmental_model: "top-down"
  cost_model: "top-down"
  aircraft_type: "dropin_fuel"
  energy_origin: "electricity"
  default: False
  inputs:
    mandate:
      mandate_type: "share"
      mandate_share: !AeroMapsCustomDataType
        years: [2020, 2025, 2030, 2035, 2040, 2045, 2050]
        values: [0.0, 0.0, 1.2, 5.0, 10.0, 15.0, 35.0]
        method: linear
    technical:
      resource_names: [ "generic_electricity" ]
      resource_specific_consumption:
        generic_electricity: 2.290426
      kerosene_selectivity: 1.0
      lhv: 44
    environmental:
      mean_co2_emission_factor_without_resource: !AeroMapsCustomDataType
        years: [2000, 2020, 2025, 2030, 2035, 2040, 2045, 2050]
        values: [130.427, 130.427, 111.3402, 58.5331, 29.9028, 19.7231, 12.0884, 7.6348]
        method: linear
      emission_index:
        h2o: 1.231
        nox: 0.01514
        sulfur: 0.0
        soot: 6.0e-06
        particles_number: 8.0e+13
    economics:
      mean_mfsp_without_resource: !AeroMapsCustomDataType
        years: [2000, 2020, 2021, 2022, 2023, 2024, 2025, 2026, 2027, 2028, 2029, 2030, 2031, 2032, 2033, 2034, 2035, 2036, 2037, 2038, 2039, 2040, 2041, 2042, 2043, 2044, 2045, 2046, 2047, 2048, 2049, 2050]
        values: [0.1053978742, 0.1053978742, 0.1053978742, 0.1053978742, 0.1053978742, 0.1053978742, 0.1053978742, 0.1053978742, 0.1012367955, 0.09708150028, 0.09284154561, 0.08866860057, 0.08769735977, 0.08674925326, 0.08582667422, 0.08495475127, 0.08418892691, 0.08348024023, 0.08281233768, 0.08218511955, 0.08165362946, 0.08120290992, 0.0808180034, 0.08049153088, 0.08016555694, 0.0795185949, 0.07860449178, 0.07753991615, 0.07643924306, 0.07536449632, 0.0743435966, 0.07338462096]
        method: linear
  outputs:

fossil_kerosene:
  name: "fossil_kerosene"
  environmental_model: "top-down"
  cost_model: "top-down"
  aircraft_type: "dropin_fuel"
  energy_origin: "fossil"
  default: True
  inputs:
    technical:
      lhv: 44
    environmental:
      mean_co2_emission_factor_without_resource: !AeroMapsCustomDataType
        years: [2000, 2050]
        values: [88.7, 88.7]
        method: linear
      emission_index:
        h2o: 1.231
        nox: 0.01514
        sulfur: 0.0
        soot: 6.0e-06
        particles_number: 8.0e+13
    economics:
      mean_mfsp_without_resource: !AeroMapsCustomDataType
        years: [2000, 2050]
        values: [0.01161470368, 0.01161470368]  # 0.41 EUR/L / 35.3
        method: linear
  outputs:
