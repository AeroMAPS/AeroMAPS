# RTE optimisation paper — migrated energy carriers.
# One generic biofuel replacing the 5 constant-share pathways (blend-weighted),
# one generic electrofuel, fossil kerosene. Values derived from the paper's own inputs.

generic_biofuel:
  name: "generic_biofuel"
  environmental_model: "top-down"
  cost_model: "top-down"
  aircraft_type: "dropin_fuel"
  energy_origin: "biomass"
  default: False
  inputs:
    mandate:
      mandate_type: "share"
      mandate_share: !AeroMapsCustomDataType
        years: [2020, 2025, 2030, 2035, 2040, 2045, 2050]
        values: [0.0, 2.0, 4.8, 15.0, 24.0, 27.0, 35.0]
        method: linear
    technical:
      resource_names: [ "generic_biomass" ]
      resource_specific_consumption:
        generic_biomass: 2.104355
      kerosene_selectivity: 1.0
      lhv: 44
    environmental:
      mean_co2_emission_factor_without_resource: !AeroMapsCustomDataType
        years: [2000, 2050]
        values: [20.8, 20.8]
        method: linear
      emission_index:
        h2o: 1.231
        nox: 0.01514
        sulfur: 0.0
        soot: 6.0e-06
        particles_number: 8.0e+13
    economics:
      mean_mfsp_without_resource: !AeroMapsCustomDataType
        years: [2000, 2050]
        values: [0.0374847, 0.0374847]  # 1.3195 EUR/L, blend-weighted from the 5 pathways
        method: linear
  outputs:

generic_electrofuel:
  name: "generic_electrofuel"
  environmental_model: "top-down"
  cost_model: "top-down"
  aircraft_type: "dropin_fuel"
  energy_origin: "electricity"
  default: False
  inputs:
    mandate:
      mandate_type: "share"
      mandate_share: !AeroMapsCustomDataType
        years: [2020, 2025, 2030, 2035, 2040, 2045, 2050]
        values: [0.0, 0.0, 1.2, 5.0, 10.0, 15.0, 35.0]
        method: linear
    technical:
      resource_names: [ "generic_electricity" ]
      resource_specific_consumption:
        generic_electricity: 2.290426
      kerosene_selectivity: 1.0
      lhv: 44
    environmental:
      mean_co2_emission_factor_without_resource: !AeroMapsCustomDataType
        years: [2000, 2020, 2025, 2030, 2035, 2040, 2045, 2050]
        values: [130.427, 130.427, 111.3402, 58.5331, 29.9028, 19.7231, 12.0884, 7.6348]
        method: linear
      emission_index:
        h2o: 1.231
        nox: 0.01514
        sulfur: 0.0
        soot: 6.0e-06
        particles_number: 8.0e+13
    economics:
      mean_mfsp_without_resource: !AeroMapsCustomDataType
        years: [2000, 2020, 2021, 2022, 2023, 2024, 2025, 2026, 2027, 2028, 2029, 2030, 2031, 2032, 2033, 2034, 2035, 2036, 2037, 2038, 2039, 2040, 2041, 2042, 2043, 2044, 2045, 2046, 2047, 2048, 2049, 2050]
        values: [0.1056973, 0.1056973, 0.1056973, 0.1056973, 0.1056973, 0.1056973, 0.1056973, 0.1056973, 0.1015244, 0.0973573, 0.0931053, 0.0889205, 0.0879465, 0.0869957, 0.0860705, 0.0851961, 0.0844281, 0.0837174, 0.0830476, 0.0824186, 0.0818856, 0.0814336, 0.0810476, 0.0807202, 0.0803933, 0.0797445, 0.0788278, 0.0777602, 0.0766564, 0.0755786, 0.0745548, 0.0735931]
        method: linear
  outputs:

fossil_kerosene:
  name: "fossil_kerosene"
  environmental_model: "top-down"
  cost_model: "top-down"
  aircraft_type: "dropin_fuel"
  energy_origin: "fossil"
  default: True
  inputs:
    technical:
      lhv: 44
    environmental:
      mean_co2_emission_factor_without_resource: !AeroMapsCustomDataType
        years: [2000, 2050]
        values: [89.0, 89.0]
        method: linear
      emission_index:
        h2o: 1.231
        nox: 0.01514
        sulfur: 0.0
        soot: 6.0e-06
        particles_number: 8.0e+13
    economics:
      mean_mfsp_without_resource: !AeroMapsCustomDataType
        years: [2000, 2050]
        values: [0.0116477, 0.0116477]  # 0.41 EUR/L
        method: linear
  outputs:
