# Coupling aviation demand to price
# =================================
#
# One block per approach, one line per work inside it. The approaches are the
# frame of Costa Alves et al. (2026), Table 1, collapsed: what the demand responds
# to, if anything, and how. The roadmaps that the ATAG reports cite when setting
# the question aside are added, since they are what the coupled scenarios of this
# paper should be read against. Works sharing every entry share a line.
#
# The table gives the price proxy each work uses, not its elasticity: a fuel
# price, a service cost and an airfare are different quantities, and an
# elasticity calibrated on one does not compare with one calibrated on another.
#
# The two value columns are on one basis each: the carbon price in 2050 in US$
# per tonne of CO2 (euros at 1.1 $/EUR, pounds at 1.27 $/GBP, currency years as
# published), and the change in 2050 traffic against the work's own case
# without the price effect. A dash means the work does not publish the quantity
# on that basis; what it does publish is kept in `source`.

columns:
  - {header: Approach, width: "0.17"}
  - {header: Works, width: "0.25"}
  - {header: Price proxy, width: "0.16"}
  - {header: "Carbon price in 2050 [\\$/t]", width: "0.14"}
  - {header: "Traffic change in 2050 [\\%]", width: "0.14"}

label: tab:demand_price
size: scriptsize

caption_head: Demand and price in comparable studies.
# The body is the author's text, as in the manuscript, so it is not wrapped in red.
caption_red: false
caption_body: >-
  How comparable studies let demand respond to the cost of decarbonising, grouped
  by approach, extending the comparison of \citet{costaalves_wctr}. The price
  proxy used is not the same quantity across rows, a fuel price, a fuel cost per
  unit of demand and an airfare reaching the traveller differently. Carbon prices
  are converted at 1.1~\$/EUR and 1.27~\$/GBP, in the currency year of each work.
  Traffic changes are against each work's own case without the price effect. A
  dash marks a value not published on this basis.

rows:
  - approach: Exogenous traffic
    works:
      - cells:
          - >-
            \citet{atag2026_waypoint}; \citet{icao}; \citet{planes_simulation_2021};
            \citet{grewe}; \citet{klower}; \citet{sacchi}
          - none
          - "0"
          - "0"
        source: >-
          the reports state it themselves; the academic works as classified by
          Costa Alves et al. (2026), Table 1

  - approach: Logistic in income
    works:
      - cells:
          - \citet{vedantham_aircraft_1994}; \citet{vidal_modelling_2021}
          - none
          - "0"
          - "0"
        source: as classified by Costa Alves et al. (2026), Table 1

  - approach: Elasticity on a growth rate
    works:
      - cells:
          - \citet{gossling_covid-19_2021}
          - fuel price
          - "400"
          - $-55$ to $-18$
        source: >-
          Gössling et al. (2021), sections 4.1 and 4.2: fuel price in US$ per kg,
          through a 24.5 % fuel share of costs; carbon price 50 $/t in 2022 to 400
          in 2050, charged again on non-CO2; 2018-2050 growth of 57 to 187 %
          against 250 % without, so 2050 traffic 1.57 to 2.87 against 3.5 times
          2018
      - cells:
          - \citet{salgas_techno-economic_2025}
          - airfare per RPK
          - "5.5"
          - $-15$ to $+5$
        source: >-
          notebooks/publications/optimisation: elasticity -0.9 on airfare per RPK
          (RPKElasticity), carbon tax input 5 EUR/t; rpk against rpk_no_elasticity
          in 2050 is -7.6 % under ReFuelEU and -14.7 to +4.9 % across the
          optimised main runs

  - approach: Elasticity in an integrated assessment model
    works:
      - cells:
          - \citet{franz}, EDGE-T
          - transport price, held constant
          - "0"
          - "0"
        source: Franz et al. (2022), Eq. 1; price elasticity set to zero
      - cells:
          - \citet{napp_role_2019}, TIAM
          - energy service price
          - 430 to 1300
          - "--"
        source: >-
          Napp et al. (2019), carbon price scenarios and Fig. 1: 100 to 300 $(2005)/t in 2020
          rising 5 % a year, so 432 to 1297 in 2050; no aviation traffic result
      - cells:
          - \citet{speizer_integrated_2024}, GCAM
          - service cost per pkm
          - "--"
          - "--"
        source: >-
          Speizer et al. (2024): 1.5 C emissions constraint, prices only in
          Supplementary Fig. 10; break-even 135 to 496 $(2020)/t for aviation; at
          least 40 % less service over 2020-2100 with low technology
      - cells:
          - \citet{sharmina_decarbonising_2021}, IMAGE
          - travel cost
          - "--"
          - "--"
        source: Sharmina et al. (2021), section 2.1; the effect is called small

  - approach: Airfare elasticity in a sectoral model
    works:
      - cells:
          - \citet{dray_cost_2022}, AIM
          - airfare
          - "0"
          - $-11$ to $-9$
        source: >-
          Dray et al. (2022), p. 959: mandates, no carbon price (300 to 400 $/t
          over 2030-35 would give the same uptake, SI); ticket prices lower RTK
          growth by 0.3 to 0.4 % a year over 2019-2050 in the middle-demand
          combined pathways, so 2050 RTK 9 to 11 % lower; 2050 CO2 up to 10 % lower
      - cells:
          - \citet{destination2050_2025}
          - ticket price
          - "347"
          - "$-17$"
        source: >-
          Destination 2050 (2025), section 2.4.2, footnotes 11 and 15: 1.21 against
          1.45 billion departing passengers in 2050 (flights 9.7 against 11.1
          million); EU ETS 315 EUR/t in 2050; demand is 19 % of the CO2 cut
      - cells:
          - \citet{gifas}
          - ticket price
          - "--"
          - $-25$
        source: >-
          GIFAS and DGAC (2023), p. 94: international traffic growth 2.1 to 1.1 %
          a year with the price effect, about -25 % after 27 to 31 years
      - cells:
          - \citet{sustainable_aviation_uk_2026}
          - ticket price
          - "125"
          - "$-15$"
        source: >-
          SA UK technical report (2026), appendix 6.1: RPK growth of 54 % against
          82 % in the DfT policy-off forecast, 1.54/1.82 - 1; section 6.4: UK ETS
          allowance 98.09 GBP/t in 2050; demand is 15 % of the CO2 cut
      - cells:
          - \citet{te_roadmap_2022}
          - airfare
          - "220"
          - "$-18$"
        source: >-
          T&E (2022), p. 35: kerosene tax and ETS reform reduce travel demand by up
          to 18 %; section 4.5: SAF costs cut leisure travel 12 to 22 %; EU ETS 200
          EUR/t in 2050
      - cells:
          - \citet{icct}; \citet{zheng_aviation_2025}
          - airfare
          - "--"
          - $-7$ to $-4$
        source: >-
          Zheng et al. (2025), p. 13: airfare and demand elasticities unchanged from
          the 2022 Vision 2050, which gives 2050 passenger traffic 4 % lower (p. 16)
          and 7 % lower (demand response section) in the Breakthrough scenario;
          carbon price implied by the SAF blend; demand response is 0.8 % of the
          avoided warming in 2025

  - approach: Price-adjusted logistic
    works:
      - cells:
          - \citet{costaalves_wctr}; this work
          - energy cost per RPK
          - 43 to 1034
          - $-22.3$ to $-2.0$
        source: >-
          same model; AR6 SSP2-4.5, 2.6 and 1.9, $(2010)/t, from 2027 in this
          work, with kerosene at the 2006-2026 lower quartile, mean and upper
          quartile; traffic from this work's coupled runs (+14.0 to -42.4 % without
          SAF). Costa Alves et al. (2026) give no 2050 value.
