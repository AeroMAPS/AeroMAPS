# Coupling aviation demand to price
# =================================
#
# One block per approach, one line per work inside it. The approaches are the
# frame of Costa Alves et al. (2026), Table 1, collapsed: what the demand responds
# to, if anything, and how. The roadmaps that the ATAG reports cite when setting
# the question aside are added, since they are what the coupled scenarios of this
# paper should be read against. Works sharing every entry share a line.
#
# The table gives the price proxy each work uses, not its elasticity: a fuel
# price, a service cost and an airfare are different quantities, and an
# elasticity calibrated on one does not compare with one calibrated on another.
#
# Cells are kept short: the detail belongs in the text, and in `source`, which
# gives where each entry was read and the fuller statement behind it.

columns:
  - {header: Approach, width: "0.17"}
  - {header: Works, width: "0.24"}
  - {header: Price proxy, width: "0.15"}
  - {header: Carbon price, width: "0.16"}
  - {header: Demand effect by 2050, width: "0.18"}

label: tab:demand_price
size: scriptsize

caption_head: Demand and price in comparable studies.
# The body is the author's text, with the changes in red, so it is not wrapped in
# red as a whole.
caption_red: false
caption_body: >-
  How comparable studies let demand respond to the cost of decarbonising, grouped
  by approach, extending the comparison of \citet{costaalves_wctr}. The price
  proxy used is not the same quantity across rows, a fuel price, a fuel cost per
  unit of demand and an airfare reaching the traveller differently,
  \textcolor{red}{so only the proxy is given. Works on one line share every
  entry.}

rows:
  - approach: Exogenous traffic
    works:
      - cells:
          - >-
            \citet{atag2026_waypoint}; \citet{icao}; \citet{planes_simulation_2021};
            \citet{grewe}; \citet{klower}; \citet{sacchi}
          - none
          - none
          - none
        source: >-
          the reports state it themselves; the academic works as classified by
          Costa Alves et al. (2026), Table 1

  - approach: Logistic in income
    works:
      - cells:
          - \citet{vedantham_aircraft_1994}; \citet{vidal_modelling_2021}
          - none
          - none
          - not stated
        source: as classified by Costa Alves et al. (2026), Table 1

  - approach: Elasticity on a growth rate
    works:
      - cells:
          - \citet{gossling_covid-19_2021}
          - fuel price
          - 50 to 400 \$/t
          - growth of 57 to 187 \% instead of 250 \%
        source: >-
          Gössling et al. (2021), sections 4.1 and 4.2: fuel price in US$ per kg,
          through a 24.5 % fuel share of costs; carbon price 50 to 400 $/t over
          2022-2050, charged again on non-CO2, with a synthetic fuel quota;
          growth over 2018-2050

  - approach: Elasticity in an integrated assessment model
    works:
      - cells:
          - \citet{franz}, EDGE-T
          - transport price, held constant
          - none
          - none from price
        source: Franz et al. (2022), Eq. 1; price elasticity set to zero
      - cells:
          - \citet{napp_role_2019}, TIAM
          - energy service price
          - 100 to 300 \$/t
          - not stated
        source: >-
          Napp et al. (2019), Table 1 and Fig. 1; 2005 USD from 2020, elasticity
          on or off; no aviation result
      - cells:
          - \citet{speizer_integrated_2024}, GCAM
          - service cost per pkm
          - 1.5 \textdegree C constraint
          - not stated for 2050
        source: >-
          Speizer et al. (2024), Results and Methods; break-even 135 to 496
          $(2020)/t for aviation; at least 40 % less service over 2020-2100 with
          low technology
      - cells:
          - \citet{sharmina_decarbonising_2021}, IMAGE
          - travel cost
          - 1.5 and 2 \textdegree C pathways
          - small
        source: Sharmina et al. (2021), section 2.1 and the discussion of IMAGE

  - approach: Airfare elasticity in a sectoral model
    works:
      - cells:
          - \citet{dray_cost_2022}, AIM
          - airfare
          - none, mandates
          - up to 10 \% less CO$_2$
        source: >-
          Dray et al. (2022), main text; SI: 300 to 400 $/t over 2030-35 would
          give the same uptake
      - cells:
          - \citet{destination2050_2025}
          - ticket price
          - EU ETS, 315 EUR/t
          - 16 \% of the CO$_2$ cut
        source: >-
          Destination 2050 (2025), section 2.4.2 and footnote 11; EU ETS 130 EUR/t
          in 2030 and 315 in 2050, CORSIA 25 EUR/t
      - cells:
          - \citet{gifas}
          - ticket price
          - not stated
          - growth 2.1 to 1.1 \%/yr
        source: GIFAS and DGAC (2023), p. 94; international traffic
      - cells:
          - \citet{sustainable_aviation_uk_2026}
          - ticket price
          - UK ETS
          - 15 \% of the CO$_2$ cut
        source: SA UK technical report (2026), Table 1 (DfT elasticities); summary
      - cells:
          - \citet{te_roadmap_2022}
          - airfare
          - EU ETS, 200 EUR/t
          - leisure $-12$ to $-22$ \%
        source: T\&E (2022), sections 4.5 and 10.5; 100 EUR/t in 2030
      - cells:
          - \citet{zheng_aviation_2025}
          - airfare
          - implied by SAF
          - 0.8 \% of avoided warming
        source: Zheng et al. (2025), p. 13 and Table 14

  - approach: Price-adjusted logistic
    works:
      - cells:
          - \citet{costaalves_wctr}; this work
          - energy cost per RPK
          - AR6 SSP2
          - $-2.9$ to $-22.0$ \%
        source: >-
          same model; the demand effect is this work's coupled runs, 43, 212 and
          1034 $(2010)/t in 2050 from 2027, +2.2 to -41.8 % without SAF. Costa
          Alves et al. (2026) give no 2050 value (-14 % traffic in 2070 with SAF).
