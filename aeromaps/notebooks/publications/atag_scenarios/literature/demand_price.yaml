# Coupling aviation demand to price
# =================================
#
# One row per approach rather than per work, methods and values in the same
# table. The approaches are the frame of Costa Alves et al. (2026), Table 1,
# collapsed: what the demand responds to, if anything, and how. The roadmaps that
# the ATAG reports cite when setting the question aside are added, since they are
# what the coupled scenarios of this paper should be read against.
#
# Values are as each work publishes them, and none of the demand effects are on
# the same basis: a change against a work's own uncoupled counterfactual, a change
# in a growth rate, and a share of an emissions reduction attributed to demand are
# three different statements. The cells say which.
#
# Works appearing here and not read directly are classified as Costa Alves et al.
# classify them; everything with a number beside it was read from the work named.

columns:
  - {header: Approach, width: "0.19"}
  - {header: Works, width: "0.20"}
  - {header: Price and elasticity, width: "0.18"}
  - {header: Carbon price, width: "0.14"}
  - {header: Demand effect by 2050, width: "0.17"}

label: tab:demand_price

caption_head: Demand and price in comparable studies.
caption_body: >-
  How comparable studies let demand respond to the cost of decarbonising, grouped
  by approach, extending the comparison of \citet{costaalves_wctr}. The price
  proxy used is not the same quantity across rows, a fuel price, a fuel cost per
  unit of demand and an airfare reaching the traveller differently, so the
  elasticities are comparable in sign and order of magnitude rather than cell for
  cell.

rows:
  - cells:
      - Exogenous traffic, no price at all
      - >-
        ATAG Waypoint 2050 \citep{atag2020_waypoint, atag2021_waypoint,
        atag2026_waypoint}; ICAO LTAG \citep{icao}; \citep{planes_2021, grewe,
        klower, sacchi}
      - none
      - none
      - none by construction
    source: >-
      the reports state it themselves; the academic works as classified by
      Costa Alves et al. (2026), Table 1

  - cells:
      - Logistic in income, saturating, no price
      - \citep{vedantham_1994, vidal_2022}
      - none
      - none
      - not stated
    source: as classified by Costa Alves et al. (2026), Table 1

  - cells:
      - Constant elasticity on a growth rate
      - \citep{gossling_covid_2021}
      - "ticket price, $-0.75$ to $-1.25$"
      - a CO$_2$ price with a synthetic fuel quota
      - >-
        growth of 57 to 187 \% over 2018--2050 against 250 \% without
    source: Gössling et al. (2021), Environ. Res. Lett. 16, 034063

  - cells:
      - Elasticity inside an integrated assessment model
      - >-
        EDGE-T \citep{franz}; TIAM \citep{napp_2019}; GCAM
        \citep{speizer_integrated_2024}; IMAGE \citep{sharmina2021decarbonising}
      - >-
        service cost; price elasticity set to zero and income elasticity of 1.55,
        declining \citep{franz}
      - >-
        100 to 300 \$/t \citep{napp_2019}; break-even 135 to 496 \$/t for
        aviation \citep{speizer_integrated_2024}
      - >-
        small; the difference between elasticity on and off
    source: >-
      Franz et al. (2022), Methods; Napp et al. (2019), Table 1; Speizer et al.
      (2024), Table 2; Sharmina et al. (2021), sections 3 and 4

  - cells:
      - Airfare elasticity on a sectoral model
      - >-
        AIM \citep{dray_cost_2022}; Destination 2050 \citep{destination2050_2025};
        \citep{gifas_dgac_2023, sustainable_aviation_uk_2026, te_roadmap_2025,
        zheng_aviation_2025}
      - >-
        airfare; $-1.0$ and $-1.5$ by segment \citep{destination2050_2025}, $-0.9$
        and $-0.6$ by market \citep{gifas_dgac_2023}, $-0.9$ on fares
        \citep{dft_elasticities}, by region pair \citep{intervistas2007}
      - >-
        300 to 400 \$/t over 2030--35 \citep{dray_cost_2022}; EU ETS 100 then 200
        EUR/t \citep{te_roadmap_2025}; UK ETS \citep{sustainable_aviation_uk_2026};
        implied by the fuel mix \citep{zheng_aviation_2025}
      - >-
        16 \% of the 2050 CO$_2$ cut \citep{destination2050_2025}; growth 2.1 to
        1.1 \%/yr \citep{gifas_dgac_2023}; 15 \% of the cut
        \citep{sustainable_aviation_uk_2026}; leisure $-12$ to $-22$ \%
        \citep{te_roadmap_2025}
    source: >-
      Dray et al. (2022) and its supplement; Destination 2050 (2025), p. 12 and
      pp. 80-81; GIFAS (2023), p. 94; the SA UK roadmap summary with the DfT
      elasticity report, Table 2; T\&E roadmap, sections 4.5 and 10.5; Zheng et
      al. (2025), pp. 13 and 40

  - cells:
      - Price-adjusted logistic, saturating in income
      - \citep{costaalves_wctr}; this work
      - >-
        energy cost per RPK, $-0.345$ with a 1.26 year delay
      - >-
        AR6 SSP2: 43, 212 and 1034 \$(2010)/t in 2050, none before 2027
      - >-
        $-2.9$, $-7.5$ and $-22.0$ \%; $+2.2$, $-14.9$ and $-41.8$ \% without SAF
    source: >-
      Costa Alves et al. (2026), Table 2; this work's coupled runs, against each
      run's own uncoupled traffic
