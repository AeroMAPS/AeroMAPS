# Contrail avoidance
# ==================
#
# Grouped by intervention rather than by work: diverting only where it is free,
# diverting the flights that matter, diverting airspace-wide, and changing the
# engine. The reports include none of them, so the last row is a set of variants
# run beside the reproduction.
#
# Reductions are not in one quantity either: an energy forcing for Teoh et al., a
# contrail length for the only flight trial, a share of contrail warming for the
# ICCT. Fuel penalties are fleetwide except for the trial, which is per flight.

columns:
  - {header: Intervention, width: "0.22"}
  - {header: Works, width: "0.18"}
  - {header: Contrail reduction, width: "0.17"}
  - {header: Fuel penalty, width: "0.15"}
  - {header: Start, width: "0.13"}

label: tab:contrail_avoidance

caption_head: Contrail avoidance.
caption_body: >-
  Avoidance assumptions, grouped by intervention, with 95 \% intervals where given.
  Reductions are in contrail forcing (Teoh et al.), contrail length (flight trial)
  or contrail warming (ICCT). Penalties are fleetwide, except per diverted flight
  for the trial. The reports assume no avoidance, so the last row lists variants of
  this work.

caption_body: >-
  Assumptions on avoiding contrails, grouped by intervention. Intervals are 95 \%
  where the study gives them. Reductions are in contrail energy forcing for Teoh
  et al., in contrail length for the flight trial, which is what a trial can
  measure, and in contrail warming for the ICCT; penalties are fleetwide except
  for the trial, which is per diverted flight. The reproduced reports assume no
  avoidance at all, so the last row is a set of variants run beside them, at
  levels named for the warming they produce, the low level carrying the strongest
  reduction.

