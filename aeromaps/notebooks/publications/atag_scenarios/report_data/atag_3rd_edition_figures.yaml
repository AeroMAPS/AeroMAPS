# Figures digitised from ATAG Waypoint 2050, 3rd edition.
#
# These are the report's own published curves, read off its charts, and they are
# what this reproduction is validated against. They are TANK-TO-WAKE: the report
# follows the CORSIA methodology, counting the combustion portion and crediting a
# SAF pathway's upstream reduction as a tank-to-wake reduction. So they belong
# beside the `*-TTW.json` runs, not the well-to-wake ones. Against the committed
# tank-to-wake technology runs at 2050 they agree to within 0.3 % (T2) and
# 2.6 % (T4). make_tables.py reports the same comparison at 2030 and 2040 and
# over the cumulative period.
#
# Years are fractional because they come from digitising a chart; interpolate
# onto a yearly grid before use rather than rounding them. Values are written at
# full repr precision so they round-trip exactly.
#
# technology_scenarios
#     The T0-T4 emissions trajectories. T0 is the notional frozen-fleet
#     efficiency trajectory. T1 is where emissions would sit with no further
#     improvement in aircraft efficiency and no new technology beyond ongoing
#     planned fleet renewal. T1-T4 are all mapped onto the central traffic
#     growth forecast, and none of them includes reductions from the other
#     pillars: operations, infrastructure, sustainable fuels or market-based
#     measures.
#
# central_traffic
#     The central traffic growth forecast, in trillion RPK, the common basis for
#     every technology scenario above.
#
# Moved verbatim out of the literals in cell 1 of
# 3rd_edition_full/validation.ipynb, so the notebook and the MyST document read
# one copy rather than maintaining two. Not re-digitised.

