# Non-CO2 uncertainty bands for the ATAG Waypoint 2050 scenarios
# ===============================================================
#
# The Waypoint 2050 reports quantify CO2 only. AeroMAPS computes the non-CO2
# terms as well, and this file sets how wide the contrail answer is allowed to
# be. It follows the approach of Wang et al. (2026) on every axis:
#
#   Wang, Z., Voigt, C., et al. (2026), Using aviation fuel hydrogen content to
#   assess contrails and climate impact, Research Square preprint,
#   doi:10.21203/rs.3.rs-10602102/v1.
#
# Three quantities are banded, each stated explicitly in every band:
#
#   1. HOW LARGE contrail RF is. Anchored, as Wang et al. do, on the 2018
#      contrail cirrus RF of Lee et al. (2021, Table 3): 111.4 (33, 189)
#      mW m-2, i.e. +-70 % at 5-95 %. The central sensitivity_rf reproduces
#      111.4 in 2018 over the historical distance every ATAG run shares
#      (see ../../../../resources/scenarios/climate_models/).
#   2. HOW EFFECTIVE that RF is at warming. Wang et al.'s RF-based efficacy,
#      sampled at 0.20, 0.31 and 0.60 (mean 0.37), carried in AeroCM's
#      ratio_erf_rf with efficacy_erf at 1.0.
#   3. HOW MUCH SAF REDUCES IT. Wang et al.'s contrail energy-forcing reduction
#      for 15.2 % fuel hydrogen content, representative of 100 % SAF:
#      52 [35, 67] %, between their high- and low-soot simulations (Fig. 2c).
#
# Bands are named by CLIMATE IMPACT, not by parameter magnitude: `high` is the
# worst outcome (largest contrail warming AND the weakest reduction from SAF),
# `low` the best. Read `high` as "high warming", never as "high mitigation".
#
# How RF and efficacy share one band
# ----------------------------------
# Wang et al. propagate RF and efficacy together in a Monte Carlo and report
# +-1 sigma. The product of two independent factors with coefficients of
# variation 0.426 (Lee's +-70 % over 1.645 sigma) and 0.456 (Wang's three
# efficacies) has a coefficient of variation of 0.653, so +-1 sigma is x0.347 and
# x1.653. That deviation is split between the two factors in proportion to their
# squared coefficients of variation (0.466 for RF, 0.534 for efficacy), so that
# each band states both explicitly and neither is pushed to an extreme. Stacking
# both extremes instead would give about x0.16 to x2.8, far wider than either
# source's own spread. The loader re-derives every band from `derivation` and
# refuses a file that disagrees with it.
#
# SAF particle-number emission index
# ----------------------------------
# FuelEffectCorrectionContrails scales contrail forcing by
#
#     sum over pathways of  massic_share * sqrt(EIn_pathway / EIn_default)
#
# which is linear in blend share exactly as Wang et al.'s Eq. 5 is, so a
# reduction R at 100 % SAF maps onto an emission index of
#
#     EIn_SAF = EIn_kerosene * (1 - R)^2        with EIn_kerosene = 2.0e14
#
# The central 4.608e13 is also what every ATAG energy file now carries, so the
# centre of every band reproduces the committed scenarios exactly, which is what
# the notebooks' drift guards check.

reference:
  citation: >-
    Contrail RF anchored on Lee et al. (2021); RF-based efficacy and SAF contrail
    reduction of Wang et al. (2026).
  dois:
    - 10.1016/j.atmosenv.2020.117834
    - 10.21203/rs.3.rs-10602102/v1

# Inputs the band values are derived from. The loader recomputes the bands from
# these and checks them against the declared values below.
derivation:
  lee_rf_2018_mw_m2: 111.4
  lee_rf_5_95_relative: 0.70
  wang_efficacy_samples: [0.20, 0.31, 0.60]
  central_sensitivity_rf: 2.05236e-12
  central_ratio_erf_rf: 0.37

# Emission index of the default drop-in pathway (fossil kerosene) in the ATAG
# energy files, used to express the SAF bounds as percentage reductions.
kerosene_emission_index_particles_number: 2.0e+14

bands:

  low:
    label: Low non-CO2
    description: >-
      Contrail RF and efficacy at -1 sigma of their product and the strongest
      reduction from SAF: the optimistic end for climate outcomes.
    sensitivity_rf: 1.25353e-12      # x0.6108 of central
    ratio_erf_rf: 0.2101             # x0.5678 of central
    contrail_erf_multiplier: 0.3468  # product, -1 sigma
    saf_emission_index_particles_number: 2.178e+13   # -67 %, Wang low-soot
    implied_saf_contrail_reduction_percent: 67.0

  central:
    label: Central
    description: >-
      Lee's 2018 contrail RF, Wang's mean efficacy and Wang's mean SAF
      reduction. Reproduces the committed scenarios exactly.
    sensitivity_rf: 2.05236e-12
    ratio_erf_rf: 0.37
    contrail_erf_multiplier: 1.0
    saf_emission_index_particles_number: 4.608e+13   # -52 %, Wang central
    implied_saf_contrail_reduction_percent: 52.0

  high:
    label: High non-CO2
    description: >-
      Contrail RF and efficacy at +1 sigma of their product and the weakest
      reduction from SAF: the pessimistic end for climate outcomes.
    sensitivity_rf: 2.59353e-12      # x1.2637 of central
    ratio_erf_rf: 0.4841             # x1.3083 of central
    contrail_erf_multiplier: 1.6532  # product, +1 sigma
    saf_emission_index_particles_number: 8.45e+13    # -35 %, Wang high-soot
    implied_saf_contrail_reduction_percent: 35.0

# Which mitigation-gain bound in contrail_variants.yaml each band pairs with,
# when the avoidance scenarios are run under these bands. The pairing follows
# the same rule: the high-warming band takes the weakest mitigation.
mitigation_pairing:
  low: strongest
  central: central
  high: weakest
