# The seven biomass feedstocks of the full edition are deliberately absent: the light
# edition merges their pathways into generic_biofuel, so generic_biomass below carries
# their summed availability. Declaring both would double-count the global envelope --
# biomass_availability_global read 1.235e15 MJ against the full edition's 6.175e14.
generic_biomass:
  #ID
  # Light edition: single generic biomass feedstock replacing the seven individual
  # biomass pathways. Global availability = sum of the seven source resources.
  name: "generic_biomass"
  origin: "biomass"
  specifications:
    co2_emission_factor: !AeroMapsCustomDataType
      years: [ ]
      values: [ 0.0 ]
      method: linear
    availability:
      global: 617.5e+12 # [MJ] = 62.5 + 75.0 + 62.5 + 62.5 + 175.0 + 62.5 + 117.5
      aviation_allocated_share: 5 # [%] Share of the global availability



green_electricity:
  # ID
  name: "green_electricity"
  origin: "electricity"
  specifications:
  # Technical:
    co2_emission_factor: !AeroMapsCustomDataType
      years: [ ]
      values: [ 15.7 ]
      method: linear
    availability:
      global: 224.1e+12 # [EJ]
      # based on IEA NZE scenario (p. 87)
      aviation_allocated_share: 5 # [%] Share of the global availability
    cost: !AeroMapsCustomDataType
      years: [ 2020, 2050 ]
      # Zero on purpose. The report-derived mean_mfsp_without_resource of every
      # carrier that consumes this resource already includes its electricity, so
      # pricing it here too would count it twice. The carriers that are NOT
      # report-derived (battery_electric, and the electrolysis/liquefaction
      # processes) carry the former value folded into their own MFSP instead, so
      # their totals are unchanged. Consumption, availability and the emission
      # factor above are untouched -- only the price is neutralised.
      values: [ 0.0, 0.0 ] # was [ 0.01597222222222222, 0.006944444444444444 ] $ / MWh
      method: linear

co2_dac:
  #ID
  name: "co2_dac"
  specifications:
    #Economical
    cost: !AeroMapsCustomDataType
      years: [2020, 2050]
      # Zero on purpose, same reason as green_electricity: electrofuel is the only
      # consumer of this resource and its report-derived MFSP already includes the
      # DAC-CO2 feedstock.
      values: [0.0, 0.0] # was [0.4, 0.1] $ / ton CO2 : 1000 kg / ton
      method: linear


transport:
  # Metadata
  name: "transport"
  specifications:
    cost: !AeroMapsCustomDataType
      years: []
      values: [0.003]
      method: linear
