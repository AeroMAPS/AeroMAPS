# Tank-to-wake twin of processes.yaml, generated by make_ttw_twins.py.
# Do not edit by hand: edit the well-to-wake file and regenerate.
#
# Drop-in pathways carry the fossil combustion baseline (73.8 gCO2/MJ) scaled by
# their carbon-intensity ratio against fossil kerosene (88.7 gCO2/MJ), which is
# the CORSIA accounting the report describes and the method the second edition's
# TTW files already use. Everything not combusted reads zero: its carbon is
# well-to-tank. Nothing else differs from the source file.
liquefaction:
  # Metadata
  name: "liquefaction"
  inputs:
    # Technical:
    technical:
      resource_names: [ "green_electricity" ]
      resource_specific_consumption:
        green_electricity: 0.25
    # Environmental:
    environmental:
      mean_co2_emission_factor_without_resource: !AeroMapsCustomDataType
        years: []
        values: [ 0.0 ]
        # pay through the resource, which is now zero there; the total is unchanged.
        method: linear
    # Economics:
    economics:
      mean_mfsp_without_resource: !AeroMapsCustomDataType
        # [1.378511,...]/120 plus 0.25 x the green_electricity price this process
        # used to pay through the resource, which is now zero there; the total is
        # unchanged. See the note in resources.yaml.
        years: [2020,2030,2040,2050]
        values: [0.015480645555555556, 0.01472833074074074, 0.013976015925925928, 0.01322370111111111]
        method: linear


electrolysis:
  # Metadata
  name: "electrolysis"
  inputs:
    # Technical:
    technical:
      resource_names: [ "green_electricity" ]
      resource_specific_consumption:
        green_electricity: 1.69
    # Environmental:
    environmental:
      mean_co2_emission_factor_without_resource: !AeroMapsCustomDataType
        years: []
        values: [ 0.0 ]
        # pay through the resource, which is now zero there; the total is unchanged.
        method: linear
    # Economics:
    economics:
      mean_mfsp_without_resource: !AeroMapsCustomDataType
        # [5.047140, 4.994914, 4.949078, 4.924813]/120 (no liquefaction there) plus
        # 1.69 x the green_electricity price this process used to pay through the
        # resource, which is now zero there; the total is unchanged.
        years: [2020, 2030, 2040, 2050]
        values: [0.06909305555555555, 0.0635074074074074, 0.05802175925925926, 0.05273611111111111]
        method: linear
