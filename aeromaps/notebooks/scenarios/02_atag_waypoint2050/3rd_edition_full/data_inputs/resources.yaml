green_electricity:
  # ID
  name: "green_electricity"
  origin: "electricity"
  specifications:
  # Technical:
    co2_emission_factor: !AeroMapsCustomDataType
      years: [ ]
      # Zero on purpose, for the same reason as the price below. The report's
      # carbon-intensity table already states each pathway's factor on a life-cycle
      # basis, electricity included, so charging this resource's carbon on top of
      # it would count the same emissions twice. The consumers that are NOT
      # report-derived (battery_electric, and the electrolysis/liquefaction
      # processes) carry the former 15.7 folded into their own factor instead, so
      # their totals are unchanged.
      values: [ 0.0 ] # was [ 15.7 ] gCO2 / MJ
      method: linear
    availability:
      global: 224.1e+12 # [EJ]
      # based on IEA NZE scenario (p. 87)
      aviation_allocated_share: 5 # [%] Share of the global availability
    cost: !AeroMapsCustomDataType
      years: [ 2020, 2050 ]
      # Zero on purpose. The report-derived mean_mfsp_without_resource of every
      # carrier that consumes this resource already includes its electricity, so
      # pricing it here too would count it twice. The carriers that are NOT
      # report-derived (battery_electric, and the electrolysis/liquefaction
      # processes) carry the former value folded into their own MFSP instead, so
      # their totals are unchanged. Consumption and availability are
      # untouched; the factor above is zeroed for the same reason, see above.
      values: [ 0.0, 0.0 ] # was [ 0.01597222222222222, 0.006944444444444444 ] $ / MWh
      method: linear

co2_dac:
  #ID
  name: "co2_dac"
  specifications:
    #Economical
    cost: !AeroMapsCustomDataType
      years: [2020, 2050]
      # Zero on purpose, same reason as green_electricity: electrofuel is the only
      # consumer of this resource and its report-derived MFSP already includes the
      # DAC-CO2 feedstock.
      values: [0.0, 0.0] # was [0.4, 0.1] $ / ton CO2 : 1000 kg / ton
      method: linear


transport:
