name: Computation Time Monitoring

on:
  pull_request:
    branches: [main]

jobs:
  check-run:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check if monitoring should run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # head_commit is unset for pull_request events; fetch the PR head commit message via the API instead.
          COMMIT_MSG=$(gh api repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }} --jq .commit.message)
          if [[ "$COMMIT_MSG" == *"[skip-tests]"* ]]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

  computation-time-monitoring:
    needs: check-run
    if: needs.check-run.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [ '3.10' ]

    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Set notebook list
        shell: bash
        run: |
          echo "NOTEBOOKS<<EOF" >> $GITHUB_ENV
          echo "aeromaps/notebooks/tutorials/01_run_a_basic_calculation/examples_basic.ipynb" >> $GITHUB_ENV
          echo "aeromaps/notebooks/tutorials/05_use_fleet_models/examples_fleet.ipynb" >> $GITHUB_ENV
          echo "aeromaps/notebooks/tutorials/06_use_climate_models/examples_climate.ipynb" >> $GITHUB_ENV
          echo "aeromaps/notebooks/tutorials/08_use_variable_demand/examples_elasticity.ipynb" >> $GITHUB_ENV
          echo "aeromaps/notebooks/publications/joas_2023/examples_joas_application.ipynb" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Save current branch name
        id: branch
        shell: bash
        run: |
          raw_branch_name=$(git rev-parse --abbrev-ref HEAD)
          echo "BRANCH_NAME=$raw_branch_name" >> $GITHUB_ENV

      - name: Checkout main branch
        run: |
          git fetch origin main:main
          git checkout main

      #TODO: Removed once migrated to uv
      - name: Install Poetry (for main branch)
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies (main)
      # TODO: change to uv sync --locked --dev once the main 
      # branch has been updated to use uv
        run: |
          poetry env use ${{ matrix.python-version }}
          poetry install

      - name: Run notebooks on main branch
        shell: bash
        env:
          NOTEBOOKS: ${{ env.NOTEBOOKS }}
        run: |
          mkdir -p "${RUNNER_TEMP}/timings"
          IFS=$'\n'
          for nb in $NOTEBOOKS; do
            nb_trimmed=$(echo "$nb" | tr -d '\r')
            echo "Timing $nb_trimmed on main"
            start=$(date +%s)
            poetry run pytest --no-cov --nbval-lax -p no:python -n 0 "$nb_trimmed"
            end=$(date +%s)
            echo "$((end - start))" > "${RUNNER_TEMP}/timings/$(basename "$nb_trimmed").main.time"
          done

      - name: Stash notebook changes (main)
        run: git stash push -u -m "Stash main branch notebook changes"

      - name: Restore branch
        run: |
          git checkout $BRANCH_NAME
          git stash pop || true
      
      # TODO: Removed once migrated to uv
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: | 
          uv lock
          uv sync 
        # --locked 

      - name: Debug environment
        shell: bash
        run: |
          echo "--- pwd ---"
          pwd
          echo "--- ls repo root ---"
          ls -la
          echo "--- pyproject.toml (deps section) ---"
          grep -A 20 'dependency-groups\|\[tool.poetry' pyproject.toml || true
          echo "--- uv.lock exists? ---"
          ls -la uv.lock || echo "NO uv.lock"
          echo "--- uv sync output ---"
          uv sync --dev
          echo "--- venv contents ---"
          ls -la .venv/bin/ | head -50
          echo "--- pytest in venv? ---"
          ls -la .venv/bin/pytest || echo "NO pytest binary"
          echo "--- uv pip list ---"
          uv pip list | grep -i pytest || echo "pytest not in uv pip list"

      - name: Verify pytest is installed
        run: uv run pytest --version

      - name: Run notebooks on current branch
        shell: bash
        env:
          NOTEBOOKS: ${{ env.NOTEBOOKS }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
        run: |
          mkdir -p "${RUNNER_TEMP}/timings"
          IFS=$'\n'
          for nb in $NOTEBOOKS; do
            nb_trimmed=$(echo "$nb" | tr -d '\r')
            safe_branch=$(echo "$BRANCH_NAME" | tr '/' '_')
            echo "Timing $nb_trimmed on $BRANCH_NAME"
            start=$(date +%s)
            uv run pytest --no-cov --nbval-lax -p no:python -n 0 "$nb_trimmed"
            end=$(date +%s)
            echo "$((end - start))" > "${RUNNER_TEMP}/timings/$(basename "$nb_trimmed").$safe_branch.time"
          done

      - name: Stash notebook changes
        run: git stash push -u -m "Stash before switching branches"

      - name: Compare timings
        shell: bash
        env:
          NOTEBOOKS: ${{ env.NOTEBOOKS }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
        run: |
          safe_branch=$(echo "$BRANCH_NAME" | tr '/' '_')
          echo "Notebook timing comparison:" >> $GITHUB_STEP_SUMMARY
          {
            header="| Notebook | OS | Python | main (s) | $BRANCH_NAME (s) | diff (s) | diff (%) |"
            sep="|----------|----|--------|----------|----------------|----------|----------|"
            echo "$header"
            echo "$sep"
            IFS=$'\n'
            for nb in $NOTEBOOKS; do
              nb_trimmed=$(echo "$nb" | tr -d '\r')
              base=$(basename "$nb_trimmed")
              os="${{ runner.os }}"
              py="${{ matrix.python-version }}"
              main_file="${RUNNER_TEMP}/timings/$base.main.time"
              branch_file="${RUNNER_TEMP}/timings/$base.$safe_branch.time"
              if [[ -f "$main_file" && -f "$branch_file" ]]; then
                t_main=$(cat "$main_file" | tr -d '\r\n')
                t_branch=$(cat "$branch_file" | tr -d '\r\n')
                if [[ -n "$t_main" && "$t_main" =~ ^[0-9]+$ && -n "$t_branch" && "$t_branch" =~ ^[0-9]+$ ]]; then
                  diff=$((t_branch-t_main))
                  if [ "$t_main" -eq 0 ]; then
                    percent=0
                  else
                    percent=$(awk -v t_main="$t_main" -v t_branch="$t_branch" 'BEGIN { printf "%.2f", (t_branch-t_main)/t_main*100 }')
                  fi
                  echo "| $base | $os | $py | $t_main | $t_branch | $diff | $percent |"
                fi
              fi
            done
          } >> $GITHUB_WORKSPACE/timing_matrix_table.md

          cat $GITHUB_WORKSPACE/timing_matrix_table.md >> $GITHUB_STEP_SUMMARY

      - name: Upload timing summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timing-matrix-summary
          path: $GITHUB_WORKSPACE/timing_matrix_table.md

      - name: Restore branch
        if: always()
        run: |
          git stash push -u -m "Stash changes before restoring branch" || true
          git checkout $BRANCH_NAME || true
          git stash pop || true
