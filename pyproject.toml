[project]
name = "aeromaps"
dynamic = ["version"]
description = "AeroMAPS: Multidisciplinary Assessment of Prospective Scenarios for air transport"
authors = [
    { name = "Thomas PLANES", email = "thomas.planes@isae-supaero.fr" },
    { name = "Scott DELBECQ", email = "scott.delbecq@isae-supaero.fr" },
    { name = "Antoine SALGAS", email = "antoine.salgas@isae-supaero.fr" },
    { name = "Felix POLLET", email = "felix.pollet@isae-supaero.fr" },
    { name = "Ian COSTA ALVES", email = "ian.costa-alves@isae-supaero.fr" },
]
requires-python = ">=3.10, <3.12"
readme = "README.md"
license = "GPL-3.0-only"
keywords = [
    "air transport",
    "climate change",
    "prospective scenarios",
    "energy issues",
]
dependencies = [

    # Core dependencies
    "numpy>=1.20.3,<2",
    "scipy>=1.4.1,<2",
    "pandas>=1.3.0,<=2.2.2",
    "xlrd==1.2.0",
    "openpyxl>=3.1.2,<4",
    # Lower bound is not cosmetic. 6.1.0 introduced `max_consecutive_unsuccessful_iterations`
    # (the divergence guard `check_mda_convergence` diagnoses) and `SequenceTransformer.set_bounds`;
    # 6.2.0 made `inner_mda_settings` a `BaseMDASettings` model, which `_setup_unified_mda` passes.
    # 6.2.0 is also what uv.lock resolves and what CI therefore tests.
    "gemseo>=6.2.0,<6.3.0",
    "deepdiff>=8,<9",
    "sympy>=1.14.0,<2",
    "dill>=0.4.0,<0.5",
    "aerocm==0.1.1b0",

    # Data visualization dependencies
    "matplotlib>=3.7,<4",
    "ipympl>=0.9.3,<0.10",
    "plotly>=5.0.0,<6",
    "seaborn>=0.13.2,<0.14",

    # Graphical User Interface
    "markdown>=3.4.3,<4",
    "aenum>=3.1.12,<4",
    "docstring-inheritance>=2.0.0,<3",
    "dacite>=1.8.0,<2",
    "jupyterlab>=3.3.0,<4",
    "ipywidgets>=8.0.6,<9",
    "ipysheet>=0.5.0, <1",
    "ipydatagrid>=1.1.14,<2",
    "ipytree>=0.2.2,<0.3",

    # Web deployment
    "voila>=0.5.0,<0.6",

]

[project.optional-dependencies]
lca = [
    "lca-modeller ; python_full_version >= '3.10' and python_full_version < '3.12'",
    "premise==2.3.4 ; python_full_version >= '3.10' and python_full_version < '3.12'",
]

[project.urls]
Homepage = "https://github.com/AeroMAPS/AeroMAPS"

[project.scripts]
aeromaps = "aeromaps.core.cli:main"

[dependency-groups]
test = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "coverage[toml]>=7.0,<8",
    "nbval>=0.11,<0.12",
    "wrapt>=1.16.0,<2",
    "nbmake>=1.5.0,<2",
    "pytest-xdist>=3.7.0,<4",
]
doc = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-bibtex>=2.16.0,<3",
    "mkdocs-jupyter>=0.25.1,<0.26",
    "mkdocs-material>=9.7.0,<10",
    "mkdocstrings[python]>=0.30.0,<0.31",
    "mike>=2.0.0,<3",
]
paper = ["mystmd>=1.3,<2"]
lint = [
    "pre-commit>=3.5.0,<4",
    "nbstripout>=0.6.0,<0.7",
    "ruff==0.5.4",
]

[tool.uv]
default-groups = "all"
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } },
]


# Packaging system =============================================================
[build-system]
requires = [
    "setuptools",
    "setuptools_scm[toml]",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["aeromaps*"]

[tool.setuptools_scm]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
